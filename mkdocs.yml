# Manual de usuario de Desco con MkDocs (Material). El sitio es SOLO el manual: cada página incluye una
# sección de docs/Manual_Usuario_Plataforma_Web.md (mkdocs-include-markdown-plugin), que sigue siendo la
# única fuente (se lee igual en GitHub). La portada (docs/index.md) es lo único escrito aparte.
#   python3.12 -m venv .venv && .venv/bin/pip install -r requirements-docs.txt   (Python 3.10 o más)
#   .venv/bin/mkdocs serve          # http://127.0.0.1:8000
#   .venv/bin/mkdocs build --strict # lo mismo que corre el workflow docs.yml
site_name: Desco · Manual de usuario
site_description: Manual de usuario de la plataforma web Desco (EcoVerde) para expertos de campo y administradores
copyright: Trabajo Terminal 2026-B161 · ESCOM · IPN
# Se publica en https://docs.formyke.com/f-sheet/ (CloudFront + Cloudflare Access; ver f-sheet/infra/docs.yaml).
site_url: https://docs.formyke.com/f-sheet/
docs_dir: docs
site_dir: site

# Guías técnicas del repo: siguen en docs/ (el README las enlaza) pero no son parte del manual.
exclude_docs: |
  correr-en-local.md
  ambiente-testing.md
  e2e-cobertura.md
not_in_nav: |
  Manual_Usuario_Plataforma_Web.md

theme:
  name: material
  language: es
  logo: assets/logo.svg
  favicon: assets/logo.svg
  # Sin Google Fonts: la CSP de la documentación solo permite recursos del mismo dominio.
  font: false
  icon:
    admonition:
      note: material/information-outline
      warning: material/alert-outline
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo claro

extra_css:
  - assets/estilos.css

hooks:
  - docs_hooks.py

plugins:
  - search:
      lang: es
  - include-markdown
  # Clic en una captura = se amplía (los archivos de glightbox se sirven desde el propio sitio).
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
      draggable: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      # Mismos ids que GitHub (conservan acentos).
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

nav:
  - Inicio: index.md
  - Empezar:
      - Introducción: introduccion.md
      - Primeros pasos: primeros-pasos.md
      - La interfaz: interfaz.md
  - Guías por pantalla:
      - Resumen: guias/resumen.md
      - Mapa: guias/mapa.md
      - Seguimiento: guias/seguimiento.md
      - Análisis: guias/analisis.md
      - Gráficos: guias/graficos.md
      - Administración: guias/administracion.md
  - Ayuda:
      - Problemas y preguntas: problemas.md
      - Glosario y soporte: glosario.md
      - Acerca de este manual: acerca.md
  - Pruebas:
      - TDD y Clean Architecture: pruebas/index.md
      - Rendimiento: pruebas/rendimiento.md
