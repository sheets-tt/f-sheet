# Documentación de f-sheet con MkDocs (Material). Las páginas incluyen secciones del README
# (mkdocs-include-markdown-plugin): el README sigue siendo la única fuente.
#   python3.12 -m venv .venv && .venv/bin/pip install -r requirements-docs.txt   (Python 3.10 o más)
#   .venv/bin/mkdocs serve          # http://127.0.0.1:8000
#   .venv/bin/mkdocs build --strict # lo mismo que corre el workflow docs.yml
site_name: f-sheet · web de Desco
site_description: Web de sheets-tt (React + TypeScript + Vite)
repo_url: https://github.com/sheets-tt/f-sheet
repo_name: sheets-tt/f-sheet
edit_uri: edit/testing/
# Se publica en https://docs.formyke.com/f-sheet/ (CloudFront + Cloudflare Access; ver f-sheet/infra/docs.yaml).
site_url: https://docs.formyke.com/f-sheet/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: es
  # Sin Google Fonts: la CSP de la documentación solo permite recursos del mismo dominio.
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: brown
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: brown
      toggle:
        icon: material/weather-sunny
        name: Modo claro

hooks:
  - docs_hooks.py

plugins:
  - search:
      lang: es
  - include-markdown

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      # Mismos ids que GitHub (conservan acentos): los enlaces del README siguen funcionando.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

nav:
  - Inicio: index.md
  - Manual de usuario: Manual_Usuario_Plataforma_Web.md
  - Funcionalidades: funcionalidades.md
  - Identidad visual: identidad-visual.md
  - Desarrollo:
      - Requisitos y desarrollo: desarrollo.md
      - Correr en local: correr-en-local.md
      - Ambiente de testing: ambiente-testing.md
  - Pruebas:
      - Pruebas: pruebas.md
      - Cobertura E2E: e2e-cobertura.md
  - Decisiones de diseño: decisiones.md
  - Infraestructura y despliegue: despliegue.md
