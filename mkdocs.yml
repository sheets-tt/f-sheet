# Manuales de usuario de Desco con MkDocs (Material): la plataforma web y la app móvil, más la sección de
# pruebas. Cada página incluye una sección de su manual (mkdocs-include-markdown-plugin), que sigue siendo la
# única fuente y se lee igual en GitHub:
#   web:    docs/Manual_Usuario_Plataforma_Web.md
#   móvil:  docs/movil/Manual_Usuario_App_Movil.md + docs/movil/photos/  (copia de mbl-sheet/docs: al
#           actualizar el manual de la app, vuelve a copiarlos aquí)
# La portada (docs/index.md) y docs/pruebas/ son lo único escrito aparte.
#   python3.12 -m venv .venv && .venv/bin/pip install -r requirements-docs.txt   (Python 3.10 o más)
#   .venv/bin/mkdocs serve          # http://127.0.0.1:8000
#   .venv/bin/mkdocs build --strict # lo mismo que corre el workflow docs.yml
site_name: Desco · Manual de usuario
site_description: Manuales de usuario de Desco (EcoVerde) - plataforma web y app móvil - para expertos de campo y administradores
copyright: Trabajo Terminal 2026-B161 · ESCOM · IPN
# Se publica en https://docs.formyke.com/f-sheet/ (CloudFront + Cloudflare Access; ver f-sheet/infra/docs.yaml).
site_url: https://docs.formyke.com/f-sheet/
docs_dir: docs
site_dir: site

# Guías técnicas del repo: siguen en docs/ (el README las enlaza) pero no son parte del manual.
exclude_docs: |
  correr-en-local.md
  ambiente-testing.md
  e2e-cobertura.md
not_in_nav: |
  Manual_Usuario_Plataforma_Web.md
  movil/Manual_Usuario_App_Movil.md

theme:
  name: material
  language: es
  logo: assets/logo.svg
  favicon: assets/logo.svg
  # Sin Google Fonts: la CSP de la documentación solo permite recursos del mismo dominio.
  font: false
  icon:
    admonition:
      note: material/information-outline
      warning: material/alert-outline
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo claro

extra_css:
  - assets/estilos.css

hooks:
  - docs_hooks.py

plugins:
  - search:
      lang: es
  - include-markdown
  # Clic en una captura = se amplía (los archivos de glightbox se sirven desde el propio sitio).
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
      draggable: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      # Mismos ids que GitHub (conservan acentos).
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

nav:
  - Inicio: index.md
  - Plataforma web:
      - Empezar:
          - Introducción: introduccion.md
          - Primeros pasos: primeros-pasos.md
          - La interfaz: interfaz.md
      - Guías por pantalla:
          - Resumen: guias/resumen.md
          - Mapa: guias/mapa.md
          - Seguimiento: guias/seguimiento.md
          - Análisis: guias/analisis.md
          - Gráficos: guias/graficos.md
          - Administración: guias/administracion.md
      - Ayuda:
          - Problemas y preguntas: problemas.md
          - Glosario y soporte: glosario.md
          - Acerca de este manual: acerca.md
  - App móvil:
      - Empezar:
          - Introducción: movil/introduccion.md
          - Primeros pasos: movil/primeros-pasos.md
          - La interfaz: movil/interfaz.md
      - Guías por pantalla:
          - Inicio: movil/guias/inicio.md
          - Nueva captura: movil/guias/nueva-captura.md
          - Mapa sin conexión: movil/guias/mapa.md
          - Alertas y sincronización: movil/guias/alertas.md
          - Perfil: movil/guias/perfil.md
      - Ayuda:
          - Problemas y preguntas: movil/problemas.md
          - Glosario y soporte: movil/glosario.md
          - Acerca de este manual: movil/acerca.md
  - Pruebas:
      - TDD y Clean Architecture: pruebas/index.md
      - Rendimiento: pruebas/rendimiento.md
